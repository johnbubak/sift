[package]
name = "sift"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "Session recall for coding agents: local SQLite FTS5 + BM25 + RRF over opencode history, snippet-budgeted."
license = "MIT"
readme = "README.md"
repository = "https://github.com/johnbubak/sift"
homepage = "https://github.com/johnbubak/sift"
documentation = "https://github.com/johnbubak/sift#readme"
keywords = ["mcp", "sqlite", "fts5", "bm25", "opencode"]
categories = ["command-line-utilities"]

[[bin]]
name = "sift"
path = "src/main.rs"

[features]
default = ["pro"]
mcp = []
spur = []
files = []
trigger = []
pro = ["mcp", "spur", "files", "trigger", "git", "web"]
git = []
web = []

[dependencies]
# bundled compiles SQLite with -DSQLITE_ENABLE_FTS5 unconditionally
# (libsqlite3-sys/build.rs:163) and -DSQLITE_USE_URI, so no feature guessing.
# Do NOT add bundled-full: it only adds modules we do not use.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
toml = "0.9"
anyhow = "1"

rmcp = { version = "3.5", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
